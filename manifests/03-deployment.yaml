apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-defect-bot
  namespace: k8s-defect-bot
  labels:
    app.kubernetes.io/name: k8s-defect-bot
spec:
  # Findings live in memory (app/store.py) -- a second replica would serve a
  # different view of the cluster depending on which pod you hit. Keep this at 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-defect-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-defect-bot
    spec:
      serviceAccountName: k8s-defect-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: k8s-defect-bot:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: k8s-defect-bot
          env:
            # Shared secret the node agents present on POST /api/agent/report.
            # Optional so the stack still comes up before you create the Secret,
            # but set it for anything beyond a test cluster.
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-defect-bot-agent-token
                  key: token
                  optional: true
            # Only for LLM_PROVIDER=claude_cli in-cluster -- from `claude setup-token`.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-defect-bot-llm
                  key: claude-code-oauth-token
                  optional: true
            # Only for LLM_PROVIDER=anthropic_api.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-defect-bot-llm
                  key: anthropic-api-key
                  optional: true
            # SMTP credentials, only needed when NOTIFY_ENABLED=true.
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k8s-defect-bot-smtp
                  key: smtp-username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-defect-bot-smtp
                  key: smtp-password
                  optional: true
          volumeMounts:
            # The user registry: who may sign in, and where their mail goes.
            - name: users
              mountPath: /etc/k8s-defect-bot
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # The first scan of a large cluster can take a while; don't flap.
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: users
          secret:
            secretName: k8s-defect-bot-users
            # Optional so the stack still starts before you create it -- the
            # collector then runs unauthenticated and warns about it at startup.
            optional: true
