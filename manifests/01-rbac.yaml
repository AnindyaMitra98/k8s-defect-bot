apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-defect-bot
  namespace: k8s-defect-bot
  labels:
    app.kubernetes.io/name: k8s-defect-bot
---
# Read-only, cluster-wide. The bot never mutates cluster state -- every
# remediation it produces is a command for a human to run.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-defect-bot
  labels:
    app.kubernetes.io/name: k8s-defect-bot
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  # Only needed by the 'deprecated_apis' rule on clusters older than 1.22.
  # Harmless on newer clusters -- the API group simply doesn't exist there.
  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-defect-bot
  labels:
    app.kubernetes.io/name: k8s-defect-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-defect-bot
subjects:
  - kind: ServiceAccount
    name: k8s-defect-bot
    namespace: k8s-defect-bot
