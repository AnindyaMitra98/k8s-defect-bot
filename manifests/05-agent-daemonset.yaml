# Node agent: one pod per node, reporting node-local health the control plane
# cannot see (disk/inode headroom, memory, load, PIDs, conntrack, kubelet health,
# container runtime, DNS, API-server reachability).
#
# It needs NO Kubernetes API permissions -- it talks only to the collector Service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-defect-bot-agent
  namespace: k8s-defect-bot
  labels:
    app.kubernetes.io/name: k8s-defect-bot
    app.kubernetes.io/component: node-agent
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-defect-bot-agent
  namespace: k8s-defect-bot
  labels:
    app.kubernetes.io/name: k8s-defect-bot
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-defect-bot
      app.kubernetes.io/component: node-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-defect-bot
        app.kubernetes.io/component: node-agent
    spec:
      serviceAccountName: k8s-defect-bot-agent
      automountServiceAccountToken: false
      # Required to reach the kubelet's healthz endpoint, which binds 127.0.0.1:10248.
      hostNetwork: true
      # With hostNetwork the pod would otherwise inherit the node's resolver and
      # never exercise cluster DNS -- which is one of the things being checked.
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      # Monitoring is only useful if it also runs on the nodes people taint.
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: k8s-defect-bot:0.3.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "agent.node_agent"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Must match the collector's AGENT_TOKEN. Create with:
            #   kubectl -n k8s-defect-bot create secret generic k8s-defect-bot-agent-token \
            #     --from-literal=token="$(openssl rand -hex 32)"
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-defect-bot-agent-token
                  key: token
                  optional: true
          envFrom:
            - configMapRef:
                name: k8s-defect-bot-agent
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: host-root
              mountPath: /host/root
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
