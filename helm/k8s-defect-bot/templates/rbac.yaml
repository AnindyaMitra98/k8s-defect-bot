{{- if .Values.rbac.create }}
{{- /* Read-only cluster-wide access. The bot never mutates cluster state. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-defect-bot.fullname" . }}
  labels:
    {{- include "k8s-defect-bot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  {{- if .Values.rbac.includeLegacyExtensions }}
  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-defect-bot.fullname" . }}
  labels:
    {{- include "k8s-defect-bot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-defect-bot.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-defect-bot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
