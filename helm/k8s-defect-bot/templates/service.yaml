apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-defect-bot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-defect-bot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "k8s-defect-bot.collectorSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
