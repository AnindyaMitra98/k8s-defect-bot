{{- if and (ne .Values.llm.provider "none") (not .Values.llm.existingSecret) (or .Values.llm.claudeCodeOauthToken .Values.llm.apiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-defect-bot.llmSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-defect-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.llm.claudeCodeOauthToken }}
  claude-code-oauth-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.llm.apiKey }}
  anthropic-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
