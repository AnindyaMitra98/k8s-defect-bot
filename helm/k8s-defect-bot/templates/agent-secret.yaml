{{- if and .Values.nodeAgent.enabled (not .Values.nodeAgent.existingSecret) }}
{{- /*
Shared bearer token for POST /api/agent/report. Generated once and then read
back from the cluster on upgrade (see the agentToken helper), so agents and the
collector never disagree about it mid-rollout.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-defect-bot.agentTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-defect-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
type: Opaque
stringData:
  token: {{ include "k8s-defect-bot.agentToken" . | quote }}
{{- end }}
