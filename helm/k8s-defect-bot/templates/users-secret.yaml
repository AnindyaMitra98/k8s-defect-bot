{{- if not .Values.auth.existingSecret }}
{{- /*
The user registry: who may sign in, what they may do, and where their
notifications go. One list serves all three, so access and alerting cannot
drift apart.

With auth.users empty the chart bootstraps a single admin with a generated
password, so a fresh install is authenticated rather than open. The password is
read back from the live Secret on upgrade, so `helm upgrade` never rotates it
silently. Replace it with a real entry (password_hash, not password) when you
add your own people -- see usage.md.
*/}}
{{- $password := "" }}
{{- if not .Values.auth.users }}
{{- $password = include "k8s-defect-bot.defaultAdminPassword" . }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-defect-bot.usersSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-defect-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.json: |
{{- if .Values.auth.users }}
    {{ toJson .Values.auth.users }}
{{- else }}
    [
      {
        "email": {{ .Values.auth.defaultAdminEmail | quote }},
        "name": "Generated admin",
        "role": "admin",
        "password": {{ $password | quote }},
        "notify": {
          "mode": "immediate",
          "min_severity": "critical",
          "include_resolved": true,
          "include_node_findings": true
        }
      }
    ]
{{- end }}
{{- if $password }}
  # Kept so `helm upgrade` can reuse it instead of generating a new one.
  generated-password: {{ $password | quote }}
{{- end }}
{{- end }}
